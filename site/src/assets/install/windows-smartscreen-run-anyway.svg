<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Segoe UI, system-ui, -apple-system, Ubuntu, Cantarell, sans-serif" role="img">
<title>Windows protected your PC: click More info, then Run anyway</title>
<rect x="0" y="0" width="560" height="330" rx="8" fill="#1f5fa8" stroke="none" stroke-width="1"/>
<text x="32" y="62" font-size="28" fill="#ffffff" font-weight="300" text-anchor="start">Windows protected your PC</text>
<text x="32" y="104.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Microsoft Defender SmartScreen prevented an unrecognized</text>
<text x="32" y="125.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">app from starting. Running this app might put your PC at risk.</text>
<text x="32" y="162.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">App:</text>
<text x="32" y="183.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Publisher:</text>
<text x="118" y="162.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">timelapse-switch-windows-x64.msi</text>
<text x="118" y="183.0" font-size="15" fill="#ffffff" font-weight="400" text-anchor="start">Unknown publisher</text>
<rect x="306" y="272" width="110" height="34" rx="2" fill="#1f5fa8" stroke="#ffffff" stroke-width="1"/>
<text x="361.0" y="294.25" font-size="15" fill="#ffffff" font-weight="500" text-anchor="middle">Run anyway</text>
<rect x="428" y="272" width="104" height="34" rx="2" fill="#1f5fa8" stroke="#ffffff" stroke-width="1"/>
<text x="480.0" y="294.25" font-size="15" fill="#ffffff" font-weight="500" text-anchor="middle">Don't run</text>
<rect x="301" y="267" width="120" height="44" rx="8" fill="none" stroke="#d2603a" stroke-width="3"/>
<circle cx="361.0" cy="250" r="14" fill="#d2603a"/>
<text x="361.0" y="255.5" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
</svg>
