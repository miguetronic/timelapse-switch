name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> "${GITHUB_OUTPUT}"
              echo 'prerelease=false' >> "${GITHUB_OUTPUT}"
              echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> "${GITHUB_OUTPUT}"
              echo 'prerelease=true' >> "${GITHUB_OUTPUT}"
              echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
              ;;
            *) echo 'validTag=false' >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Check Out 🛒
        uses: actions/checkout@v4
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: source

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download
        with:
          path: artifacts

      - name: Collect, Installers, Checksums and SBOM 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Collect, Installers, Checksums and SBOM 🪪
          # The same files as release-please.yaml: tools/release-files.sh.
          sudo apt-get update -qq
          sudo apt-get install -y -qq wixl
          (cd source && tools/release-files.sh ../artifacts ../release \
            "${{ steps.check.outputs.version }}")
          {
            echo 'Install guide: https://miguetronic.github.io/timelapse-switch/guide/install/'
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat release/CHECKSUMS.txt
            echo '```'
          } > notes.md

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/notes.md
          files: ${{ github.workspace }}/release/*

      - name: Publish Release 📣
        if: fromJSON(steps.check.outputs.validTag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.version }}
        run: |
          : Publish Release 📣
          # Created as a draft so it is never public without its files; publish it now.
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
