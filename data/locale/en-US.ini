A11y.ResumeChoice="how it will resume"
A11y.Hour.One="1 hour"
A11y.Hour.Many="%1 hours"
A11y.Minute.One="1 minute"
A11y.Minute.Many="%1 minutes"
A11y.Second.One="1 second"
A11y.Second.Many="%1 seconds"
