Hotkey.Speed4="Timelapse Switch: Speed x4"
Hotkey.Speed8="Timelapse Switch: Speed x8"
Hotkey.Speed16="Timelapse Switch: Speed x16"
# Chapter names written into Hybrid MP4 files; %1 is the speed. A plain "x", not "×": many players read
# chapter names in an old Mac text encoding, where "×" comes out as two wrong letters.
Chapter.RealTime="Real time"
Chapter.Timelapse="Timelapse x%1"

# Hotkeys added with the dock.
Hotkey.Faster="Timelapse Switch: Faster"
Hotkey.Slower="Timelapse Switch: Slower"
Hotkey.Chapter="Timelapse Switch: Add chapter marker"
Hotkey.Pause="Timelapse Switch: Pause or resume"
# A chapter added by hand; %1 is its number in the recording.
Chapter.Marker="Marker %1"

# The dock. %1 is a speed (4 for ×4) unless said otherwise. Labels wrap to two lines in
# narrow docks instead of getting shorter (a verb never becomes a noun).
Dock.Title="Timelapse Switch"
# The state block: a tally (am I recording?) in capitals, and a hero (at what speed?).
State.Tally.Ready="READY"
State.Tally.Rec="REC"
State.Tally.Paused="PAUSED"
State.Tally.Starting="STARTING"
State.Tally.Saving="SAVING"
State.Tally.Saved="SAVED"
State.Tally.Error="ERROR"
State.Hero.RealTime="REAL TIME"
# The speed is drawn next to it, as a badge.
State.Hero.Timelapse="TIMELAPSE"
# Idle, saving and summary heroes are quiet: sentence case, so they never look like a recording.
State.Hero.StartsRealTime="Starts in real time"
State.Hero.StartsTimelapse="Starts in timelapse ×%1"
# Paused: the mode it will resume in, quiet too (sentence case).
State.Hero.ResumesRealTime="Resumes in real time"
State.Hero.ResumesTimelapse="Resumes in timelapse ×%1"
State.Hero.Starting="Starting"
State.Hero.Saving="Finishing the file"
State.Hero.Saved="File ready"
Speed.Value="×%1"
Counter.Recorded.Caption="RECORDED"
Counter.Final.Caption="FINAL VIDEO"
# The status line while recording: "This stretch ×4  19:37 → 4:54".
Counter.Stretch="This stretch"
# The status line while paused: "Paused for  0:01:12".
Counter.Paused="Paused for"
Action.Record="Record with Timelapse Switch"
Action.ToTimelapse="Switch to timelapse ×%1"
Action.ToRealTime="Back to real time"
Action.Stop="Stop and save"
# Beside Stop while recording; while paused the same button reads Action.Resume.
Action.Pause="Pause"
Action.Resume="Resume"
# The main button while paused: it always names the mode it will resume in.
Action.ResumeRealTime="Resume in real time"
Action.ResumeTimelapse="Resume in timelapse ×%1"
# Captions above the rails, shown in capitals; no colons.
Label.Speed="Timelapse speed"
Label.NextSpeed="Next speed"
Label.SpeedNow="Speed now"
Label.StartIn="Start in"
Label.ResumeIn="Resume in"
