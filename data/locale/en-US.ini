# The summary card, a ticket: a small caption, then the waiting skipped as one big figure (52:35)
# with its caption under it, shown in capitals. Summary.Skipped is what a screen reader says for
# the figure; %1 is a duration in words.
Card.Session="Session"
Summary.Skipped.Caption="of waiting skipped"
Summary.Skipped="You skipped %1 of waiting."
Summary.Thanks="Nice session!"
Button.OpenFolder="Open folder"
Button.Play="Play"
Button.CopyDetails="Copy details"
Button.LearnMore="Learn more"
Button.Close="Close"
# The caption at the top of an error card, shown in capitals; %1 is a code such as TSW-E103.
Card.Error="Error %1"
# Error card: what happened, what is safe, what to do. In .Saved, %1 is the recorded time and %2 the final length.
Error.Why="Why:"
# The error's headline in the state block: 2 to 5 plain words.
Error.E001.Headline="Could not start"
Error.E002.Headline="Encoder not available"
Error.E103.Headline="Recording stopped"
Error.E901.Headline="Something went wrong"
Error.WhatToDo="What to do:"
Error.E001.What="Recording could not start."
Error.E001.Saved="Nothing was recorded, and your scenes are fine."
Error.E001.Todo="try again. If it happens again, check the format and encoder in Settings > Output."
Error.E002.What="The video encoder isn't available."
Error.E002.Saved="Nothing was recorded yet."
Error.E002.Todo="choose another encoder in Settings > Output > Recording, then try again."
Error.E103.What="The file could not be written."
Error.E103.Saved="Everything up to %1 (%2 of final video) is saved."
Error.E103.Todo="check the file and the free space on its disk."
Error.E901.What="Something unexpected happened."
Error.E901.Saved="Your scenes are fine."
Error.E901.Todo="please report it with your log (Help > Log Files > Upload Current Log File)."

# The health line (UX-134): it takes the context line while the recording needs attention, with a
# warning glyph and its code, the most urgent first: E102, E302, E201, E203. In E102, %1 is the
# time left ("8 min"); in E201, the frames lost.
Health.E102="Disk almost full: %1 left. Free some space, or stop soon."
Health.E201="Frames lost: %1. The computer is busy; close heavy programs."
# Shown while OBS's own recording runs at the same time (UX-023).
Health.E302="Two recordings are running: OBS's own and Timelapse Switch. That means two files and more work for your computer. Stop one if you only need one."
Health.E203="The encoder is falling behind, so frames may be lost. Close heavy programs."
# %1 is the health line's words and code.
A11y.Announce.Health="Warning: %1"
