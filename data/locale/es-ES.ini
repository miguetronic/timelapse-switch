Summary.Skipped="Te ahorraste %1 de espera."
Summary.Thanks="¡Buena sesión!"
Button.OpenFolder="Abrir carpeta"
Button.Play="Reproducir"
Button.CopyDetails="Copiar detalles"
Button.LearnMore="Más información"
Button.Close="Cerrar"
# The caption at the top of an error card, shown in capitals; %1 is a code such as TSW-E103.
Card.Error="Error %1"
# Error card: what happened, what is safe, what to do. In .Saved, %1 is the recorded time and %2 the final length.
Error.Why="Por qué:"
