# The health line (UX-134): it takes the context line while the recording needs attention, with a
# warning glyph and its code, the most urgent first: E102, E302, E201, E203. In E102, %1 is the
# time left ("8 min"); in E201, the frames lost.
Health.E102="Disco casi lleno: quedan %1. Libera espacio o termina pronto."
Health.E201="Fotogramas perdidos: %1. El equipo no da abasto; cierra programas pesados."
# Shown while OBS's own recording runs at the same time (UX-023).
Health.E302="Hay dos grabaciones en curso: la propia de OBS y la de Timelapse Switch. Eso son dos archivos y más trabajo para tu equipo. Detén una si solo necesitas una."
Health.E203="El codificador se está retrasando y podrían perderse fotogramas. Cierra programas pesados."
# %1 is the health line's words and code.
A11y.Announce.Health="Aviso: %1"
