Hotkey.Slower="Timelapse Switch: Más lento"
Hotkey.Chapter="Timelapse Switch: Añadir marca de capítulo"
Hotkey.Pause="Timelapse Switch: Pausar o reanudar"
# A chapter added by hand; %1 is its number in the recording.
Chapter.Marker="Marca %1"

# The dock. %1 is a speed (4 for ×4) unless said otherwise. Labels wrap to two lines in
# narrow docks instead of getting shorter (a verb never becomes a noun).
Dock.Title="Timelapse Switch"
# The state block: a tally (am I recording?) in capitals, and a hero (at what speed?).
State.Tally.Ready="LISTO"
State.Tally.Rec="GRABANDO"
State.Tally.Paused="EN PAUSA"
State.Tally.Starting="INICIANDO"
State.Tally.Saving="GUARDANDO"
State.Tally.Saved="GUARDADO"
State.Tally.Error="ERROR"
State.Hero.RealTime="TIEMPO REAL"
# The speed is drawn next to it, as a badge.
State.Hero.Timelapse="TIMELAPSE"
# Idle, saving and summary heroes are quiet: sentence case, so they never look like a recording.
State.Hero.StartsRealTime="Empieza en tiempo real"
State.Hero.StartsTimelapse="Empieza en timelapse ×%1"
# Paused: the mode it will resume in, quiet too (sentence case).
State.Hero.ResumesRealTime="Seguirá en tiempo real"
State.Hero.ResumesTimelapse="Seguirá en timelapse ×%1"
State.Hero.Starting="Iniciando"
State.Hero.Saving="Terminando el archivo"
State.Hero.Saved="Archivo listo"
Speed.Value="×%1"
Counter.Recorded.Caption="GRABADO"
Counter.Final.Caption="DURACIÓN FINAL"
# The status line while recording: "Este tramo ×4  19:37 → 4:54".
