Error.E002.What="El codificador de vídeo no está disponible."
Error.E002.Saved="Todavía no se grabó nada."
Error.E002.Todo="elige otro codificador en Ajustes > Salida > Grabación y vuelve a intentarlo."
Error.E103.What="No se pudo escribir el archivo."
